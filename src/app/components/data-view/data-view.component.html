<!-- components/data-view/data-view.component.html -->
<div class="data-view-container">
    <div class="header">
        <h1>GitHub Data Viewer</h1>
        <button mat-button routerLink="/">
            <mat-icon>arrow_back</mat-icon>
            Back to Integration
        </button>
    </div>

    <mat-card class="controls-card">
        <mat-card-content>
            <div class="controls">
                <mat-form-field appearance="outline" class="collection-select">
                    <mat-label>Active Integration</mat-label>
                    <mat-select disabled>
                        <mat-option value="github">GitHub</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="collection-select">
                    <mat-label>Entity (Collection)</mat-label>
                    <mat-select [(value)]="selectedCollection" (selectionChange)="onCollectionChange()">
                        <mat-option *ngFor="let collection of collections" [value]="collection">
                            {{ collection }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="search-field">
                    <mat-label>Global Search</mat-label>
                    <input matInput [(ngModel)]="searchTerm" (keyup.enter)="onSearch()"
                        placeholder="Search across all fields...">
                    <button mat-icon-button matSuffix (click)="onSearch()" *ngIf="!searchTerm">
                        <mat-icon>search</mat-icon>
                    </button>
                    <button mat-icon-button matSuffix (click)="onClearSearch()" *ngIf="searchTerm">
                        <mat-icon>clear</mat-icon>
                    </button>
                </mat-form-field>

                <button mat-raised-button color="primary" (click)="exportToCsv()">
                    <mat-icon>download</mat-icon>
                    Export CSV
                </button>
            </div>
        </mat-card-content>
    </mat-card>

    <div class="spinner-container" *ngIf="isLoading">
        <mat-spinner diameter="50"></mat-spinner>
    </div>

    <div class="grid-container" *ngIf="!isLoading && selectedCollection && columnDefs.length > 0">
        <ag-grid-angular style="width: 100%; height: 100%;" class="ag-theme-material" [columnDefs]="columnDefs"
            [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
        </ag-grid-angular>
    </div>

    <div class="no-data" *ngIf="!isLoading && (!selectedCollection || columnDefs.length === 0)">
        <mat-icon>inbox</mat-icon>
        <p>No collections available. Please sync your GitHub data first.</p>
    </div>
</div>
